name: Submit URLs to search engines

# 手动触发，不挂在 push 上：IndexNow 的官方指引明确要求只提交「新增或变更」的 URL，
# 每次发版都全量重推会被视为滥用。所以这里默认手工跑，参数可按需选。
on:
  workflow_dispatch:
    inputs:
      scope:
        description: '推送范围'
        required: true
        default: 'changed'
        type: choice
        options:
          - changed
          - all
      limit:
        description: '最多推送条数（0 = 不限）'
        required: false
        default: '0'
      google_inspect:
        description: '附带 Google 收录体检'
        required: false
        default: false
        type: boolean

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # changed 模式要 diff，浅克隆拿不到基线
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Build (to regenerate sitemap)
        run: pnpm build

      - name: Submit
        run: |
          FLAGS=""
          [ "${{ inputs.scope }}" = "changed" ] && FLAGS="$FLAGS --changed"
          [ "${{ inputs.limit }}" != "0" ] && FLAGS="$FLAGS --limit ${{ inputs.limit }}"
          [ "${{ inputs.google_inspect }}" = "true" ] && FLAGS="$FLAGS --google-inspect"
          pnpm submit:index $FLAGS
        env:
          # Variables 而非 Secrets：密钥本身是公开文件的内容，不敏感
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
          GOOGLE_SITE_URL: ${{ vars.GOOGLE_SITE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
